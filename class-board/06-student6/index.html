<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>다들 뭐하고 있나요?</title>
  <meta name="description" content="졸업전시 준비 기간, 같은 반 사람들이 각자 뭘 하고 있는지 보는 공유 작업판">
  <meta property="og:type" content="website">
  <meta property="og:title" content="다들 뭐하고 있나요?">
  <meta property="og:description" content="졸업전시 준비 기간, 같은 반 사람들이 각자 뭘 하고 있는지 보는 공유 작업판">
  <meta property="og:url" content="https://whatareyoudoingnow.com/">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
</head>
<body data-page="06-student6" data-root="..">
  <main class="layout">
    <section class="board-wrap">
      <iframe id="board" name="board" title="작업 문서" allowfullscreen></iframe>
    </section>

    <aside class="side">
      <nav class="card top">
        <a id="everyone" href="#">다들 뭐하고 있나요?</a>
        <a id="home" href="#">홈</a>
      </nav>

      <nav class="card names" id="names" aria-label="사람들"></nav>

      <nav class="card links" id="links" aria-label="문서 전환"></nav>

      <section class="card timer" id="timer" aria-label="타이머"></section>

      <section class="card guestbook" id="guestbook" aria-label="방명록">
        <h2>방명록 · 익명</h2>
        <form>
          <textarea maxlength="500" rows="3" placeholder="아무 말이나 남기기 (⌘/Ctrl + Enter)" required></textarea>
          <div class="gb-row">
            <span class="gb-count">0/500</span>
            <button type="submit">남기기</button>
          </div>
        </form>
        <p class="gb-status" hidden></p>
        <ul class="gb-list"></ul>
      </section>
    </aside>
  </main>

  <script src="../config.js"></script>
  <script src="../script.js"></script>
</body>
</html>
